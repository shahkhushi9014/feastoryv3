server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # When frontend + backend run on the same box (docker-compose / single EC2),
    # forward API + uploaded images to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }
    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
